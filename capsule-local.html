  #pixel-capsule-desktop-v2 .px-add, #pixel-capsule-desktop-v2 .px-roster-toggle, #pixel-capsule-desktop-v2 .px-roster button { padding:9px 12px; border:1px solid var(--px-border); font:inherit; color:var(--px-text); background:var(--px-surface); }
  #pixel-capsule-desktop-v2 .px-add { background:var(--px-dark); color:var(--px-on-dark); border-color:var(--px-dark); }
  #pixel-capsule-desktop-v2 button:disabled { opacity:.5; cursor:not-allowed; }
  #pixel-capsule-desktop-v2 .px-roster { padding:0 16px 14px; background:var(--px-surface); }
  #pixel-capsule-desktop-v2 .px-roster-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 0; border-top:1px solid var(--px-border); }
  #pixel-capsule-desktop-v2 .px-roster-info { flex:1; min-width:140px; overflow-wrap:anywhere; }
  #pixel-capsule-desktop-v2 .px-roster-name { font-family:var(--px-font); font-size:12px; }
  #pixel-capsule-desktop-v2 .px-roster-task { font-size:12px; color:var(--px-muted); }
  #pixel-capsule-desktop-v2 .px-roster-art { width:80px; height:48px; image-rendering:pixelated; }
  #pixel-capsule-desktop-v2 .px-txt-record { padding:12px 16px; background:var(--px-surface); }
  #pixel-capsule-desktop-v2 .px-txt-name { margin-bottom:8px; font-size:12px; overflow-wrap:anywhere; }
  #pixel-capsule-desktop-v2 .px-txt-content { width:100%; padding:10px; background:var(--px-input); color:var(--px-text); border:1px solid var(--px-border); font:14px/1.6 monospace; resize:none; overflow:hidden; }
  #pixel-capsule-desktop-v2 .px-desktop { position:relative; height:530px; background:var(--px-bg); isolation:isolate; }
  #pixel-capsule-desktop-v2 .px-work { position:absolute; left:20px; top:24px; padding:18px 20px; width:calc(100% - 40px); max-width:365px; background:var(--px-surface); color:var(--px-muted); box-shadow:0 10px 28px #00000006; }
  #pixel-capsule-desktop-v2 .px-work span { font-size:12px; }
  #pixel-capsule-desktop-v2 .px-work div { height:4px; background:var(--px-border); opacity:.25; margin-top:16px; width:85%; }
  #pixel-capsule-desktop-v2 .px-work div:last-child { width:55%; }
  #pixel-capsule-desktop-v2 .px-capsule { position:absolute; width:120px; height:72px; border:0; padding:0; background:transparent; z-index:3; touch-action:none; }
  #pixel-capsule-desktop-v2 .px-capsule canvas { width:120px; height:72px; display:block; pointer-events:none; image-rendering:pixelated; }
  #pixel-capsule-desktop-v2 .px-capsule.px-unlocked { cursor:grab; }
  #pixel-capsule-desktop-v2 .px-capsule.px-dragging { cursor:grabbing; z-index:5; }

  #pixel-capsule-desktop-v2 .px-spark { position:absolute; z-index:5; width:6px; height:6px; pointer-events:none; background:var(--px-spark-color); animation:px-spark .8s steps(8) forwards; }
  #pixel-capsule-desktop-v2 .px-popup { position:absolute; z-index:7; width:370px; max-width:calc(100% - 24px); padding:14px; background:var(--px-surface); border:2px solid var(--px-border); box-shadow:4px 4px 0 var(--px-dark); font-family:var(--px-font); font-size:12px; }
  #pixel-capsule-desktop-v2 .px-popup-head { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:10px; color:var(--px-muted); }
  #pixel-capsule-desktop-v2 .px-close { color:var(--px-text); border:1px solid var(--px-border); background:var(--px-input); width:28px; height:28px; padding:0; font:12px var(--px-font); }
  #pixel-capsule-desktop-v2 .px-field-label { display:block; }
  #pixel-capsule-desktop-v2 .px-title, #pixel-capsule-desktop-v2 .px-notes { display:block; width:100%; color:var(--px-text); background:var(--px-input); border:2px solid var(--px-border); padding:8px; margin-top:7px; font:24px/1.5 var(--px-font); font-weight:400; font-synthesis:none; resize:none; overflow:hidden; border-radius:0; }
  #pixel-capsule-desktop-v2 .px-title { min-height:56px; }
  #pixel-capsule-desktop-v2 .px-notes { min-height:110px; }
  #pixel-capsule-desktop-v2 .px-title::placeholder, #pixel-capsule-desktop-v2 .px-notes::placeholder { color:var(--px-muted); }
  #pixel-capsule-desktop-v2 .px-time { margin:8px 0 14px; color:var(--px-muted); white-space:pre-line; }
  #pixel-capsule-desktop-v2 .px-save-state { margin:6px 0 12px; color:var(--px-muted); }
  #pixel-capsule-desktop-v2 .px-complete { width:100%; padding:11px 8px; border:2px solid var(--px-dark); box-shadow:2px 2px 0 var(--px-border); background:var(--px-dark); color:var(--px-on-dark); font:12px/1.5 var(--px-font); }
  #pixel-capsule-desktop-v2 .px-desk-hint { position:absolute; left:12px; right:12px; bottom:10px; text-align:right; color:var(--px-muted); font-size:12px; pointer-events:none; }
  #pixel-capsule-desktop-v2 .px-reward-layer { position:absolute; inset:0; z-index:9; pointer-events:none; }
  #pixel-capsule-desktop-v2 .px-reward { position:absolute; top:42%; left:50%; transform:translate(-50%,-50%); width:calc(100% - 32px); max-width:480px; text-align:center; opacity:0; transition:opacity .35s ease; }
  #pixel-capsule-desktop-v2 .px-reward.px-visible { opacity:1; }
  #pixel-capsule-desktop-v2 .px-reward.px-fading { opacity:0; transition:opacity 1.8s ease; }
  #pixel-capsule-desktop-v2 .px-reward canvas { width:216px; height:216px; display:block; margin:auto; image-rendering:pixelated; filter:drop-shadow(0 8px 20px #c78f2830); }
  #pixel-capsule-desktop-v2 .px-reward-copy { display:inline-block; padding:12px 14px; margin-top:12px; border:2px solid var(--px-border); box-shadow:3px 3px 0 #00000012; background:var(--px-surface); font:24px/1.5 var(--px-font); word-break:break-word; }
  #pixel-capsule-desktop-v2 .px-letter:nth-child(7n+1) { color:light-dark(#bc496c,#ff91b0); }
  #pixel-capsule-desktop-v2 .px-letter:nth-child(7n+2) { color:light-dark(#b26a28,#ffd185); }
  #pixel-capsule-desktop-v2 .px-letter:nth-child(7n+3) { color:light-dark(#8b7921,#e7df80); }
  #pixel-capsule-desktop-v2 .px-letter:nth-child(7n+4) { color:light-dark(#418754,#9cdda0); }
  #pixel-capsule-desktop-v2 .px-letter:nth-child(7n+5) { color:light-dark(#308b91,#8edee2); }
  #pixel-capsule-desktop-v2 .px-letter:nth-child(7n+6) { color:light-dark(#537ec3,#a6c5ff); }
  #pixel-capsule-desktop-v2 .px-letter:nth-child(7n) { color:light-dark(#9564b0,#d9a6ee); }
  #pixel-capsule-desktop-v2 .px-message { min-height:30px; padding:7px 14px; color:var(--px-muted); font-size:12px; }
  @keyframes px-goodbye { 30% { transform:translateY(-20px); } 100% { transform:translateY(-42px) scale(.15); opacity:0; } }
  @keyframes px-spark { to { transform:translate(var(--px-dx),var(--px-dy)); opacity:0; } }
  @media(max-width:420px) { #pixel-capsule-desktop-v2 .px-header { padding-top:54px; padding-right:16px; } #pixel-capsule-desktop-v2 .px-new { font-size:16px; } #pixel-capsule-desktop-v2 .px-close { width:44px; height:44px; } #pixel-capsule-desktop-v2 .px-popup { padding:10px; } #pixel-capsule-desktop-v2 .px-desk-hint { text-align:center; } }
  @media(prefers-reduced-motion:reduce) { #pixel-capsule-desktop-v2 .px-capsule.px-exit { animation:none; opacity:0; } #pixel-capsule-desktop-v2 .px-spark { display:none; } #pixel-capsule-desktop-v2 .px-reward, #pixel-capsule-desktop-v2 .px-reward.px-fading { transition-duration:.6s; } }
</style>
<script>
(() => {
  const root=document.getElementById('pixel-capsule-desktop-v2');
  const stage=root.querySelector('.px-desktop'),popup=root.querySelector('.px-popup'),newInput=root.querySelector('.px-new');
  const titleInput=root.querySelector('.px-title'),notesInput=root.querySelector('.px-notes'),roster=root.querySelector('.px-roster');
  const palettes=[{name:'红色胶囊',main:'#ee7d87',shade:'#ce5d79',shine:'#ffc2b7'},{name:'黄色胶囊',main:'#eec669',shade:'#cca249',shine:'#ffe7ae'},{name:'绿色胶囊',main:'#8bc99c',shade:'#65a585',shine:'#c8e9b8'}];
  const defaultPositions=[[.12,.77],[.48,.66],[.85,.78]];
  const lines=['又做好一件事啦，为你开心！','你认真努力的样子，闪闪发光。','一步一步，已经走得很棒啦！','小小的坚持，也有大大的力量。','今天的你，值得一个大大的拥抱。'];
  const allLines=['三件事都完成啦，今天辛苦了！','今天也把日子过得很棒，为你鼓掌！'];
  let tasks=[{text:'写完项目升级的第一版方案',note:'',done:false,createdAt:Date.now(),completedAt:null,rx:.12,ry:.77}],selected=null,placing=null,busy=false,rewardCount=0;
  if(window.threeThingsLocal===true)tasks=[];
  let saveTimer=null,clickTimer=null,rewardActive=false,ownSnapshot='',lastWidth=0;
  const positions=new Map(),rewardQueue=[];
  const message=text=>{root.querySelector('.px-message').textContent=text;};
  function valid(data){return data?.version===2&&Array.isArray(data.tasks)&&data.tasks.length<=3&&data.tasks.every(t=>typeof t.text==='string'&&t.text.length<=120&&typeof t.note==='string'&&t.note.length<=1000&&typeof t.done==='boolean'&&Number.isFinite(t.createdAt)&&(t.completedAt===null||Number.isFinite(t.completedAt))&&Number.isFinite(t.rx)&&Number.isFinite(t.ry)&&t.rx>=0&&t.rx<=1&&t.ry>=0&&t.ry<=1);}
  function adopt(data){tasks=data.tasks.map(t=>({...t}));rewardCount=Number.isInteger(data.rewardCount)&&data.rewardCount>=0?data.rewardCount:0;positions.clear();}
  const restored=window.openai?.widgetState?.privateContent;if(valid(restored))adopt(restored);
  function capsule(canvas,index){
    const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,40,24);ctx.save();ctx.translate(4,0);
    const p=palettes[index],ink='#604555',cream='#fff0d0',dot=(x,y,c,w=1,h=1)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
    const spans=[[8,23],[6,25],[4,27],[3,28],[2,29],[2,29],[2,29],[2,29],[2,29],[2,29],[3,28],[4,27],[6,25],[8,23]];
    spans.forEach(([l,r],row)=>{for(let x=l;x<=r;x++){const prev=spans[row-1],next=spans[row+1];const edge=x===l||x===r||!prev||!next||x<prev[0]||x>prev[1]||x<next[0]||x>next[1];dot(x,row+3,edge?ink:(x<15?(row>9?p.shade:p.main):cream));}});
    dot(7,5,p.shine,5);dot(5,6,p.shine,3);dot(4,7,p.shine);dot(14,5,p.shade,1,10);
    dot(18,8,ink,2,3);dot(25,8,ink,2,3);dot(18,8,'#fff9ed');dot(25,8,'#fff9ed');
    dot(17,12,'#eca4a0',2);dot(27,12,'#eca4a0',2);
    dot(20,12,ink);dot(24,12,ink);dot(21,13,ink,3);
    dot(8,17,ink,2,3);dot(22,17,ink,2,3);dot(7,20,ink,3);dot(22,20,ink,3);
    ctx.restore();
    // 两条向上弯的小手臂，接上奶油色的像素手套。
    dot(3,10,ink,2);dot(4,11,ink,2);dot(5,12,ink,2);
    dot(1,6,ink,2);dot(0,7,ink,4,3);dot(1,10,ink,3);
    dot(1,7,cream,2,2);dot(2,9,cream);dot(0,9,cream);
    dot(35,10,ink,2);dot(34,11,ink,2);dot(33,12,ink,2);
    dot(37,6,ink,2);dot(36,7,ink,4,3);dot(36,10,ink,3);
    dot(37,7,cream,2,2);dot(37,9,cream);dot(39,9,cream);
  }
  function clipToPixels(button,canvas){
    const data=canvas.getContext('2d').getImageData(0,0,40,24).data;let path='';
    for(let y=0;y<24;y++){let x=0;while(x<40){while(x<40&&!data[(y*40+x)*4+3])x++;const left=x;while(x<40&&data[(y*40+x)*4+3])x++;if(left<x)path+=`M${left*3} ${y*3}h${(x-left)*3}v3h${-(x-left)*3}Z`;}}
    button.style.clipPath=`path('${path}')`;
  }
  function smile(canvas){
    const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,36,36);
    const dot=(x,y,c,w=1,h=1)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
    const inside=(x,y)=>(x-17.5)**2+(y-17.5)**2<=15.5**2;
    for(let y=0;y<36;y++)for(let x=0;x<36;x++)if(inside(x,y)){const edge=!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);dot(x,y,edge?'#c58b49':(y>27?'#f2c174':'#ffe4a1'));}
    dot(9,6,'#fff4ce',5);dot(7,7,'#fff4ce',3);dot(6,8,'#fff4ce',2);
    const ink='#72514f';[[9,15],[10,14],[11,13],[12,13],[13,14],[14,15],[21,15],[22,14],[23,13],[24,13],[25,14],[26,15]].forEach(([x,y])=>dot(x,y,ink));
    dot(6,18,'#eca59c',5,2);dot(25,18,'#eca59c',5,2);
    [[11,23],[12,24],[13,25],[14,26],[15,26],[16,27],[17,27],[18,27],[19,27],[20,26],[21,26],[22,25],[23,24],[24,23]].forEach(([x,y])=>dot(x,y,ink));
  }
  function stamp(ts){return new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});}
  function completedTXT(task,index){
    const pad=(n,width=2)=>String(n).padStart(width,'0');
    const date=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
    const d=new Date(task.completedAt),day=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`,clock=`${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}${pad(d.getMilliseconds(),3)}`;
    const safeTitle=Array.from(task.text.replace(/[<>:"/\\|?*\u0000-\u001f]/g,'_').trim()).slice(0,40).join('').replace(/[. ]+$/g,'')||'任务';
    const filename=`三件事_${day}_${clock}_${index+1}_${safeTitle}.txt`;
    const text=['三件事 · 单项完成记录','========================================',`任务内容：${task.text}`,'完成状态：已完成',`创建时间：${date(task.createdAt)}`,`完成时间：${date(task.completedAt)}`,'','心得 / 灵感 / 想记录的话：',task.note.trim()||'（未填写）','','========================================'].join('\n').replace(/\r?\n/g,'\r\n');
    return {filename,text};
  }
  function exportTXT(task,index,showPreview=false){
    const record=completedTXT(task,index);
    if(window.threeThingsLocal===true){
      const blob=new Blob(['\ufeff',record.text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');
      anchor.href=url;anchor.download=record.filename;anchor.hidden=true;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
      return {filename:record.filename,downloaded:true};
    }
    if(showPreview){const box=root.querySelector('.px-txt-record'),content=root.querySelector('.px-txt-content');box.hidden=false;root.querySelector('.px-txt-name').textContent=record.filename;content.value=record.text;autosize(content);}
    return {filename:record.filename,downloaded:false};
  }
  function snapshot(){
    tasks.forEach((t,i)=>{const p=positions.get(i);if(p){t.rx=Math.max(0,Math.min(1,p.x/Math.max(1,stage.clientWidth-120)));t.ry=Math.max(0,Math.min(1,p.y/(530-104)));}});
    return {version:2,tasks:tasks.map(t=>({...t})),rewardCount};
  }
  function save(){
    clearTimeout(saveTimer);const data=snapshot();ownSnapshot=JSON.stringify(data);
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{style:'可爱像素胶囊',placement:'自由摆放，双击解锁拖动',tasks:tasks.map(t=>({text:t.text,done:t.done}))},privateContent:data}).catch(()=>{});
  }
  function laterSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{save();root.querySelector('.px-save-state').textContent='已自动保存';},220);}
  function autosize(input){input.style.height='auto';const style=getComputedStyle(input);input.style.height=(input.scrollHeight+parseFloat(style.borderTopWidth)+parseFloat(style.borderBottomWidth))+'px';}
  function updateCounts(){const done=tasks.filter(t=>t.done).length;root.querySelector('.px-count').textContent=`今日已创建 ${tasks.length} / 3 · 完成 ${done}`;root.querySelector('.px-add').disabled=tasks.length>=3||busy;newInput.disabled=tasks.length>=3||busy;if(tasks.length>=3)newInput.placeholder='今日三个名额已用完';}
  function place(btn,index){
    const t=tasks[index],p=positions.get(index)||{x:t.rx*(stage.clientWidth-120),y:t.ry*(stage.clientHeight-104)};
    p.x=Math.max(8,Math.min(stage.clientWidth-128,p.x));p.y=Math.max(8,Math.min(stage.clientHeight-104,p.y));positions.set(index,p);btn.style.left=p.x+'px';btn.style.top=p.y+'px';
  }
  function renderRoster(){
    roster.replaceChildren();tasks.forEach((t,index)=>{
      const row=document.createElement('div');row.className='px-roster-row';const art=document.createElement('canvas');art.width=40;art.height=24;art.className='px-roster-art';art.setAttribute('aria-hidden','true');capsule(art,index);
      const info=document.createElement('div');info.className='px-roster-info';const name=document.createElement('div');name.className='px-roster-name';name.textContent=`${palettes[index].name} · ${t.done?'已完成':'待完成'}`;
      const text=document.createElement('div');text.className='px-roster-task';text.textContent=t.text;info.append(name,text);
      const view=document.createElement('button');view.type='button';view.className='cursor-interaction';view.textContent=t.done?'查看记录':'查看任务';view.addEventListener('click',()=>show(index));row.append(art,info,view);
      if(t.done){const txt=document.createElement('button');txt.type='button';txt.className='cursor-interaction';txt.textContent=window.threeThingsLocal===true?'补下载 TXT':'查看 TXT';txt.addEventListener('click',()=>{exportTXT(t,index,true);});row.append(txt);}
      roster.append(row);
    });
  }
  function close(){
    clearTimeout(clickTimer);if(selected!==null&&titleInput.value.trim())tasks[selected].text=titleInput.value.trim();selected=null;popup.hidden=true;stage.style.height='530px';
    stage.querySelectorAll('.px-capsule').forEach(btn=>{btn.setAttribute('aria-expanded','false');place(btn,Number(btn.dataset.order));});
  }
  function arrangePopup(){
    if(selected===null||popup.hidden)return;const t=tasks[selected],p=positions.get(selected)||{x:t.rx*(stage.clientWidth-120),y:t.ry*(stage.clientHeight-104)};const w=popup.offsetWidth,h=popup.offsetHeight;
    let left=Math.max(12,Math.min(stage.clientWidth-w-12,p.x+60-w/2)),top;
    if(p.x+120+w+24<=stage.clientWidth||p.x-w-12>=12){
      left=p.x+120+w+24<=stage.clientWidth?p.x+132:p.x-w-12;
      if(h+64>stage.clientHeight)stage.style.height=(h+64)+'px';
      top=Math.max(12,Math.min(stage.clientHeight-h-40,p.y+36-h/2));
    }else{top=p.y-h-14;if(top<12){top=p.y+72+14;if(top+h+16>stage.clientHeight)stage.style.height=(top+h+40)+'px';}}
    popup.style.left=left+'px';popup.style.top=Math.max(12,top)+'px';
  }
  function show(index){
    if(busy)return;clearTimeout(clickTimer);selected=index;placing=null;stage.querySelectorAll('.px-capsule').forEach(btn=>{btn.classList.remove('px-unlocked');btn.setAttribute('aria-expanded',String(Number(btn.dataset.order)===index));});

<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>

      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;

      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");

        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
