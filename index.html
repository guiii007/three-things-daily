<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三件事 · 每日核心任务</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-base: #06080a;
    --bg-panel: #0c0f14;
    --bg-card: #0f131a;
    --bg-card-hover: #121720;
    --line-soft: rgba(100, 120, 150, 0.08);
    --line-mid: rgba(120, 150, 190, 0.15);
    --text-main: #d0d5de;
    --text-sub: #8a94a5;
    --text-dim: #5a6475;
    --text-accent: #f0d040;
    --accent: #5b9cff;
    --accent-soft: #4a7fc2;
    --accent-glow: rgba(91, 156, 255, 0.35);
    --done-tint: rgba(91, 156, 255, 0.04);
  }

  * { -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg-base);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', 'PingFang SC', 'Microsoft YaHei', monospace;
    min-height: 100vh;
  }

  body {
    background:
      radial-gradient(1400px 700px at 85% -5%, rgba(91, 156, 255, 0.04), transparent 60%),
      radial-gradient(1000px 600px at -5% 105%, rgba(74, 127, 194, 0.03), transparent 60%),
      var(--bg-base);
  }

  /* 渐变微光分割线 */
  .glow-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-mid), transparent);
    position: relative;
  }
  .glow-line::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    opacity: 0;
    transition: opacity 600ms ease;
  }
  .glow-line:hover::after { opacity: 0.4; }

  /* 面板 */
  .panel {
    background: linear-gradient(180deg, rgba(255,255,255,0.008), rgba(255,255,255,0)) , var(--bg-panel);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-mid), transparent);
    opacity: 0.5;
  }

  /* 输入框 */
  .field {
    background: transparent;
    border: 1px solid var(--line-soft);
    color: #ffffff;
    transition: border-color 400ms ease, box-shadow 400ms ease;
    position: relative;
  }
  .field::after {
    content: '';
    position: absolute; left: 0; bottom: 0; height: 1px; width: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transition: width 500ms ease;
  }
  .field:focus {
    outline: none;
    border-color: var(--line-mid);
    box-shadow: 0 0 0 1px rgba(91,156,255,0.06), -3px 0 0 0 var(--accent-glow);
  }
  .field:focus::after { width: 100%; }

  /* 输入流动线条 */
  .flow-line {
    position: absolute; left: 0; right: 0; bottom: 0; height: 1px; overflow: hidden;
    pointer-events: none;
  }
  .flow-line span {
    position: absolute; top: 0; left: -30%; width: 30%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    opacity: 0;
  }
  .field:focus + .flow-line span,
  .field:focus ~ .flow-line span {
    animation: flow 2.4s linear infinite;
    opacity: 0.7;
  }
  @keyframes flow {
    0% { left: -30%; }
    100% { left: 100%; }
  }

  /* 任务卡片 */
  .task-card {
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    transition: background 400ms ease, border-color 400ms ease, opacity 400ms ease;
    position: relative;
  }
  .task-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--line-mid);
  }
  .task-card.done {
    background: var(--done-tint);
    border-color: rgba(91, 156, 255, 0.15);
    opacity: 0.72;
  }
  .task-card.done .task-text {
    text-decoration: line-through;
    text-decoration-color: rgba(140, 170, 210, 0.35);
    color: var(--text-sub);
  }

  /* 对勾按钮 */
  .check-btn {
    width: 30px; height: 30px;
    border: 1px solid var(--line-mid);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: all 350ms ease;
    position: relative;
    flex-shrink: 0;
    background: transparent;
  }
  .check-btn:hover {
    border-color: var(--accent-soft);
    box-shadow: 0 0 12px rgba(91,156,255,0.15);
  }
  .check-btn svg {
    width: 15px; height: 15px;
    stroke: var(--text-dim);
    stroke-width: 2.2;
    fill: none;
    transition: stroke 350ms ease, transform 350ms ease;
  }
  .check-btn.checked {
    border-color: var(--accent-soft);
    background: rgba(91, 156, 255, 0.06);
    animation: pulse-glow 3.6s ease-in-out infinite;
  }
  .check-btn.checked svg {
    stroke: var(--accent);
    transform: scale(1.05);
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(91,156,255,0.0); }
    50% { box-shadow: 0 0 8px 0 rgba(91,156,255,0.15); }
  }

  /* 点击扩散光效 */
  .ripple {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events: none;
    animation: ripple-out 600ms ease-out forwards;
  }
  @keyframes ripple-out {
    0% { transform: scale(0); opacity: 0.9; }
    100% { transform: scale(4); opacity: 0; }
  }

  /* 导出按钮 */
  .export-btn {
    background: linear-gradient(180deg, rgba(91,156,255,0.03), rgba(91,156,255,0));
    border: 1px solid var(--line-mid);
    color: var(--text-accent);
    transition: all 400ms ease;
    position: relative;
    overflow: hidden;
  }
  .export-btn::before {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: linear-gradient(180deg, transparent, var(--accent-glow));
    transition: height 450ms ease;
  }
  .export-btn:hover::before { height: 50%; }
  .export-btn:hover {
    border-color: var(--accent-soft);
    color: #fff;
  }
  .export-btn:active {
    transform: translateY(1px) scale(0.99);
    transition: transform 120ms ease;
  }

  /* 普通按钮 */
  .ghost-btn {
    background: transparent;
    border: 1px solid var(--line-soft);
    color: var(--text-sub);
    transition: all 350ms ease;
  }
  .ghost-btn:hover {
    border-color: var(--line-mid);
    color: var(--text-accent);
  }
  .ghost-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* 提示弹窗 */
  .toast {
    position: fixed; left: 50%; bottom: 100px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10, 13, 18, 0.94);
    border: 1px solid var(--line-mid);
    color: var(--text-accent);
    padding: 11px 20px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease, transform 400ms ease;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(91,156,255,0.1);
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 时间戳 */
  .ts {
    color: var(--text-accent);
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  /* 序号标识 */
  .idx {
    color: var(--text-dim);
    font-size: 12px;
    width: 26px;
    text-align: right;
    flex-shrink: 0;
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(120,150,190,0.12); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(120,150,190,0.25); }

  /* 进入动画 */
  .fade-in {
    animation: fadeIn 500ms ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 删除按钮 */
  .del-btn {
    color: var(--text-dim);
    transition: color 300ms ease, transform 300ms ease;
    opacity: 0;
  }
  .task-card:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: #c98a8a; transform: rotate(90deg); }

  /* 编辑模式 */
  .edit-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-mid);
    color: #ffffff;
    width: 100%;
    outline: none;
  }

  /* 完成奖励动画 */
  .reward-pulse {
    animation: rewardPulse 1s ease-out forwards;
  }
  @keyframes rewardPulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(91, 156, 255, 0); }
    30% { transform: scale(1.03); box-shadow: 0 0 20px 4px rgba(91, 156, 255, 0.25); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(91, 156, 255, 0); }
  }

  .float-light {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(91, 156, 255, 0.9) 0%, rgba(91, 156, 255, 0.3) 50%, transparent 70%);
    pointer-events: none;
    animation: floatUp 2s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-100px) scale(0.3); }
  }

  .page-glow {
    animation: pageGlow 3s ease-out;
  }
  @keyframes pageGlow {
    0%, 100% { background: var(--bg); }
    25%, 75% { background: rgba(91, 156, 255, 0.03); }
    50% { background: rgba(91, 156, 255, 0.06); }
  }

  .congrats-overlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    pointer-events: none;
    z-index: 100;
    animation: congratsAnim 3s ease-out forwards;
  }
  .congrats-text {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.25em;
    white-space: nowrap;
    background: linear-gradient(
      90deg,
      #9ab4d4 0%,
      #a8d8c8 16%,
      #c8d8a8 32%,
      #e8d89a 48%,
      #d8b8a0 64%,
      #c0a8d8 80%,
      #9ab4d4 100%
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowFlow 4s linear infinite;
    filter: drop-shadow(0 0 12px rgba(91, 156, 255, 0.25));
  }
  @keyframes rainbowFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @keyframes congratsAnim {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
  }

  @media (max-width: 640px) {
    .del-btn { opacity: 1; }
  }

  /* 图片模块 */
  .img-item {
    position: relative;
    display: inline-block;
    cursor: grab;
    transition: transform 300ms ease, box-shadow 300ms ease, opacity 200ms ease;
    border-radius: 4px;
    overflow: hidden;
    user-select: none;
  }
  .img-item:hover {
    transform: scale(1.05);
    box-shadow: 0 0 12px 2px rgba(91, 156, 255, 0.3);
  }
  .img-item:active {
    cursor: grabbing;
  }
  .img-item img {
    display: block;
    max-height: 60px;
    object-fit: contain;
    border-radius: 4px;
    pointer-events: none;
  }
  .img-item.dragging {
    opacity: 0.3;
    transform: scale(0.95);
  }
  .img-item.drag-over-left {
    margin-left: 4px;
    box-shadow: -3px 0 0 0 var(--accent);
  }
  .img-item.drag-over-right {
    margin-right: 4px;
    box-shadow: 3px 0 0 0 var(--accent);
  }
  .img-del {
    position: absolute;
    bottom: 3px; right: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(10, 13, 18, 0.85);
    border: 1px solid rgba(91, 156, 255, 0.4);
    color: var(--text-sub);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 250ms ease, transform 250ms ease;
    cursor: pointer;
    z-index: 2;
  }
  .img-item:hover .img-del {
    opacity: 1;
  }
  .img-del:hover {
    transform: scale(1.15);
    color: #c98a8a;
    border-color: rgba(201, 138, 138, 0.5);
  }
  .img-del svg { width: 10px; height: 10px; }

  /* 图片预览弹窗 */
  .img-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 7, 10, 0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    backdrop-filter: blur(8px);
  }
  .img-modal.hidden { display: none; }
  .img-modal img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(91, 156, 255, 0.15);
  }
  .img-modal-close {
    position: absolute;
    top: 24px; right: 24px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(20, 25, 35, 0.8);
    border: 1px solid var(--line-mid);
    color: var(--text-sub);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 300ms ease;
  }
  .img-modal-close:hover {
    border-color: var(--accent-soft);
    color: var(--text-accent);
    box-shadow: 0 0 12px rgba(91, 156, 255, 0.2);
  }
</style>
</head>
<body class="pb-24">

  <!-- 顶部 -->
  <header class="px-4 md:px-6 lg:px-8 pt-6 pb-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div>
          <h1 class="text-lg md:text-xl tracking-[0.3em] text-[var(--text-accent)]">三 件 事</h1>
          <p class="ts mt-1.5" id="dateLabel"></p>
        </div>
      </div>
      <div class="flex-1 flex items-center justify-center px-4 min-h-[60px]">
        <div id="imageGrid" class="flex flex-wrap gap-2 items-center justify-center">
          <div id="imageEmpty" class="ts text-[var(--text-dim)] flex items-center gap-2">
            点击右侧 + 上传，放置个人图片
          </div>
        </div>
      </div>
      <div class="text-right flex items-center gap-3">
        <label class="cursor-pointer inline-flex items-center justify-center w-8 h-8 rounded-md border border-[var(--line-mid)] text-[var(--text-sub)] hover:border-[var(--accent-soft)] hover:text-[var(--text-accent)] hover:shadow-[0_0_10px_rgba(91,156,255,0.2)] transition-all duration-300" title="上传图片">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <input type="file" id="imageUpload" accept="image/*" multiple class="hidden" />
        </label>
        <div>
          <div class="ts">完成进度</div>
          <div class="text-base text-[var(--text-accent)] mt-1" id="progressLabel">0 / 0</div>
        </div>
      </div>
    </div>

    <div class="glow-line mt-4"></div>
  </header>

  <!-- 输入区 -->
  <section class="px-4 md:px-6 lg:px-8 mt-3">
    <div class="panel p-4 md:p-5">
      <div class="flex items-center justify-between mb-3">
        <span class="ts tracking-widest">NEW · 录入今日核心任务</span>
        <span class="ts" id="countHint">0 / 3</span>
      </div>
      <div class="flex gap-3">
        <div class="relative flex-1">
          <input
            id="taskInput"
            type="text"
            maxlength="120"
            placeholder="今日要专注完成的一件事…"
            class="field w-full px-3.5 py-3 rounded-md text-base placeholder-[var(--text-dim)]"
          />
          <div class="flow-line"><span></span></div>
        </div>
        <button id="addBtn" class="ghost-btn px-5 rounded-md text-base">添加</button>
      </div>
      <p class="ts mt-3">每日聚焦三件核心事项 · 创建即记录时间 · 数据本地留存</p>
    </div>
  </section>

  <!-- 任务列表 -->
  <main class="px-4 md:px-6 lg:px-8 mt-4">
    <div id="taskList" class="space-y-3.5"></div>
    <div id="emptyState" class="text-center py-12 ts">
      — 暂无任务 · 录入第一件核心事项 —
    </div>
  </main>

  <!-- 底部导出 -->
  <footer class="fixed bottom-0 left-0 right-0 z-40">
    <div class="px-4 md:px-6 lg:px-8 pb-4 pt-2">
      <div class="glow-line mb-3"></div>
      <div class="flex items-center justify-between gap-3">
        <span class="ts">本地存档 · LocalStorage</span>
        <button id="exportBtn" class="export-btn px-6 py-2.5 rounded-md text-base tracking-wider">
          导出 TXT
        </button>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- 图片全屏预览弹窗 -->
  <div id="imgPreviewModal" class="img-modal hidden">
    <img id="imgPreviewImg" alt="preview" />
    <button id="imgPreviewClose" class="img-modal-close" title="关闭">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </button>
  </div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'three_things_data_v1';
  const IMG_STORAGE_KEY = 'three_things_images_v1';
  const MAX_TASKS = 3;
  const MAX_IMG_SIZE = 400;

  const $ = (id) => document.getElementById(id);
  const listEl = $('taskList');
  const emptyEl = $('emptyState');
  const inputEl = $('taskInput');
  const addBtn = $('addBtn');
  const exportBtn = $('exportBtn');
  const countHint = $('countHint');
  const progressLabel = $('progressLabel');
  const dateLabel = $('dateLabel');
  const toastEl = $('toast');
  const imageUpload = $('imageUpload');
  const imageGrid = $('imageGrid');
  const imageEmpty = $('imageEmpty');
  const imgPreviewModal = $('imgPreviewModal');
  const imgPreviewImg = $('imgPreviewImg');
  const imgPreviewClose = $('imgPreviewClose');

  let images = loadImages();

  const pad = (n) => String(n).padStart(2, '0');
  const timeStr = (ts) => ts ? `${pad(new Date(ts).getHours())}:${pad(new Date(ts).getMinutes())}` : '';
  const dateTimeStr = (ts) => {
    const d = new Date(ts);
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const dateStr = (ts) => {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()} / ${pad(d.getMonth()+1)} / ${pad(d.getDate())}  ·  周${['日','一','二','三','四','五','六'][d.getDay()]}`;
  };

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ----- 数据 -----
  let tasks = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function loadImages() {
    try {
      const raw = localStorage.getItem(IMG_STORAGE_KEY);
      if (!raw) return [];
      const data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function saveImages() {
    try { localStorage.setItem(IMG_STORAGE_KEY, JSON.stringify(images)); } catch (e) {
      toast('图片存储失败，可能超出浏览器存储限制');
    }
  }

  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const max = MAX_IMG_SIZE;
          if (w > max || h > max) {
            if (w > h) { h = h * max / w; w = max; }
            else { w = w * max / h; h = max; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleImageUpload(files) {
    const newImgs = [];
    for (let i = 0; i < files.length; i++) {
      if (!files[i].type.startsWith('image/')) continue;
      const dataUrl = await compressImage(files[i]);
      newImgs.push({
        id: Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2,6),
        data: dataUrl
      });
    }
    if (newImgs.length) {
      images = images.concat(newImgs);
      saveImages();
      renderImages();
    }
  }

  function deleteImage(id) {
    images = images.filter(img => img.id !== id);
    saveImages();
    renderImages();
  }

  function renderImages() {
    const items = imageGrid.querySelectorAll('.img-item');
    items.forEach(el => el.remove());
    if (images.length === 0) {
      imageEmpty.classList.remove('hidden');
      imageEmpty.style.display = '';
      return;
    }
    imageEmpty.classList.add('hidden');
    imageEmpty.style.display = 'none';
    images.forEach((img, idx) => {
      const item = document.createElement('div');
      item.className = 'img-item';
      item.dataset.id = img.id;
      item.dataset.index = idx;
      item.draggable = true;

      const im = document.createElement('img');
      im.src = img.data;
      im.alt = '';
      im.addEventListener('click', () => openImagePreview(img.data));

      const del = document.createElement('button');
      del.className = 'img-del';
      del.title = '删除图片';
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (confirm('确定删除该图片？')) deleteImage(img.id);
      });

      item.appendChild(im);
      item.appendChild(del);
      imageGrid.appendChild(item);
    });
    setupDragAndDrop();
  }

  let dragSrcIndex = -1;

  function setupDragAndDrop() {
    const items = imageGrid.querySelectorAll('.img-item');
    items.forEach(item => {
      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('dragleave', handleDragLeave);
      item.addEventListener('drop', handleDrop);
      item.addEventListener('dragend', handleDragEnd);
    });
  }

  function handleDragStart(e) {
    dragSrcIndex = Number(e.currentTarget.dataset.index);
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragSrcIndex);
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const item = e.currentTarget;
    const rect = item.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    clearDragOverClass();
    if (e.clientX < midX) {
      item.classList.add('drag-over-left');
    } else {
      item.classList.add('drag-over-right');
    }
  }

  function handleDragLeave(e) {
    e.currentTarget.classList.remove('drag-over-left', 'drag-over-right');
  }

  function handleDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    const targetIndex = Number(e.currentTarget.dataset.index);
    const rect = e.currentTarget.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    const insertBefore = e.clientX < midX;

    clearDragOverClass();

    if (dragSrcIndex < 0 || dragSrcIndex === targetIndex) return;

    const [moved] = images.splice(dragSrcIndex, 1);
    let newIndex = targetIndex;
    if (dragSrcIndex < targetIndex) newIndex--;
    if (!insertBefore) newIndex++;
    images.splice(newIndex, 0, moved);

    saveImages();
    renderImages();
  }

  function handleDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    clearDragOverClass();
    dragSrcIndex = -1;
  }

  function clearDragOverClass() {
    const items = imageGrid.querySelectorAll('.img-item');
    items.forEach(it => it.classList.remove('drag-over-left', 'drag-over-right'));
  }

  function openImagePreview(dataUrl) {
    imgPreviewImg.src = dataUrl;
    imgPreviewModal.classList.remove('hidden');
  }
  function closeImagePreview() {
    imgPreviewModal.classList.add('hidden');
    imgPreviewImg.src = '';
  }

  // ----- 操作 -----
  function addTask(text) {
    text = (text || '').trim();
    if (!text) { toast('请输入任务内容'); return false; }
    if (tasks.length >= MAX_TASKS) { toast(`每日核心任务不超过 ${MAX_TASKS} 件`); return false; }
    tasks.push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
      text,
      createdAt: Date.now(),
      completedAt: null,
      done: false,
      note: ''
    });
    save();
    render();
    return true;
  }

  function updateTask(id, patch) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    Object.assign(t, patch);
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(x => x.id !== id);
    save();
    render();
  }

  function toggleDone(id, btn) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (btn) {
      const r = document.createElement('span');
      r.className = 'ripple';
      const size = 30;
      r.style.width = r.style.height = size + 'px';
      r.style.left = '0px'; r.style.top = '0px';
      btn.appendChild(r);
      setTimeout(() => r.remove(), 600);
    }
    const done = !t.done;
    updateTask(id, {
      done,
      completedAt: done ? Date.now() : null
    });

    if (done) {
      const card = document.querySelector(`.task-card[data-id="${id}"]`);
      if (!card) return;
      const doneCount = tasks.filter(x => x.done).length;
      showRewardAnimation(card, doneCount);
    }
  }

  function showRewardAnimation(card, doneCount) {
    if (doneCount >= 1) {
      card.classList.add('reward-pulse');
      card.addEventListener('animationend', function handler(e) {
        if (e.animationName === 'rewardPulse') {
          card.classList.remove('reward-pulse');
          card.removeEventListener('animationend', handler);
        }
      });
    }

    const lightCount = doneCount >= 3 ? 40 : (doneCount >= 2 ? 20 : 10);
    const lightDuration = doneCount >= 3 ? 2000 : (doneCount >= 2 ? 2000 : 1000);
    const cardRect = card.getBoundingClientRect();
    for (let i = 0; i < lightCount; i++) {
      const light = document.createElement('div');
      light.className = 'float-light';
      const offsetX = (Math.random() - 0.5) * 160;
      const offsetY = -Math.random() * 40;
      light.style.left = (cardRect.left + cardRect.width / 2 + offsetX) + 'px';
      light.style.top = (cardRect.top + offsetY) + 'px';
      light.style.animationDuration = (lightDuration + Math.random() * 500) + 'ms';
      light.style.animationDelay = (i * 0.04) + 's';
      light.style.zIndex = 50;
      document.body.appendChild(light);
      setTimeout(() => light.remove(), lightDuration + 600);
    }

    if (doneCount >= 3) {
      document.body.classList.add('page-glow');
      setTimeout(() => document.body.classList.remove('page-glow'), 3000);

      const overlay = document.createElement('div');
      overlay.className = 'congrats-overlay';
      const text = document.createElement('div');
      text.className = 'congrats-text';
      text.textContent = '今日三件事 · 全部完成';
      overlay.appendChild(text);
      document.body.appendChild(overlay);
      setTimeout(() => overlay.remove(), 3000);
    }
  }

  // ----- 渲染 -----
  function render() {
    dateLabel.textContent = todayStr();
    countHint.textContent = `${tasks.length} / ${MAX_TASKS}`;
    const doneCount = tasks.filter(t => t.done).length;
    progressLabel.textContent = `${doneCount} / ${tasks.length}`;

    addBtn.disabled = tasks.length >= MAX_TASKS;

    if (tasks.length === 0) {
      listEl.innerHTML = '';
      emptyEl.style.display = '';
      return;
    }
    emptyEl.style.display = 'none';

    listEl.innerHTML = '';
    tasks.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'task-card p-4.5 fade-in' + (t.done ? ' done' : '');
      card.style.padding = '1.125rem';
      card.dataset.id = t.id;

      const head = document.createElement('div');
      head.className = 'flex items-start gap-3.5';

      const idx = document.createElement('div');
      idx.className = 'idx mt-1';
      idx.textContent = String(i + 1).padStart(2, '0');

      const mid = document.createElement('div');
      mid.className = 'flex-1 min-w-0';

      const textRow = document.createElement('div');
      textRow.className = 'task-text text-[15px] md:text-[16px] leading-relaxed break-words cursor-text text-[var(--text-accent)]';
      textRow.textContent = t.text;
      textRow.title = '点击编辑';
      textRow.addEventListener('click', () => enterEdit(textRow, t));

      const meta = document.createElement('div');
      meta.className = 'ts mt-2.5 flex flex-wrap items-center gap-x-3.5 gap-y-1.5';
      meta.innerHTML = `<span>创建 ${dateTimeStr(t.createdAt)}</span>` +
        (t.completedAt ? `<span class="text-[var(--accent-soft)]">完成 ${dateTimeStr(t.completedAt)}</span>` : '');

      mid.appendChild(textRow);
      mid.appendChild(meta);

      const checkBtn = document.createElement('button');
      checkBtn.className = 'check-btn' + (t.done ? ' checked' : '');
      checkBtn.title = t.done ? '标记为未完成' : '标记为已完成';
      checkBtn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>`;
      checkBtn.addEventListener('click', () => toggleDone(t.id, checkBtn));

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn p-1';
      delBtn.title = '删除任务';
      delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>`;
      delBtn.addEventListener('click', () => {
        if (confirm('确定删除该任务？')) deleteTask(t.id);
      });

      head.appendChild(idx);
      head.appendChild(mid);
      head.appendChild(checkBtn);
      head.appendChild(delBtn);

      const noteWrap = document.createElement('div');
      noteWrap.className = 'mt-3.5 relative';
      const noteInput = document.createElement('textarea');
      noteInput.className = 'field w-full px-3.5 py-2.5 rounded-md text-[14px] resize-none placeholder-[var(--text-dim)]';
      noteInput.rows = 2;
      noteInput.placeholder = '记录完成这件事的心得 / 复盘…';
      noteInput.value = t.note || '';
      noteInput.addEventListener('input', () => {
        clearTimeout(noteInput._timer);
        noteInput._timer = setTimeout(() => {
          const task = tasks.find(x => x.id === t.id);
          if (task) {
            task.note = noteInput.value;
            save();
          }
        }, 400);
      });
      const flow = document.createElement('div');
      flow.className = 'flow-line';
      flow.innerHTML = '<span></span>';
      noteWrap.appendChild(noteInput);
      noteWrap.appendChild(flow);

      card.appendChild(head);
      card.appendChild(noteWrap);
      listEl.appendChild(card);
    });
  }

  function enterEdit(textEl, task) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'edit-input text-[15px] md:text-[16px] py-0.5';
    input.value = task.text;
    input.maxLength = 120;
    textEl.replaceWith(input);
    input.focus();
    input.select();

    const commit = () => {
      const v = input.value.trim();
      if (v && v !== task.text) {
        updateTask(task.id, { text: v });
      } else {
        render();
      }
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      else if (e.key === 'Escape') { render(); }
    });
  }

  // ----- 事件 -----
  addBtn.addEventListener('click', () => {
    if (addTask(inputEl.value)) {
      inputEl.value = '';
      inputEl.focus();
    }
  });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
  });

  exportBtn.addEventListener('click', () => {
    exportTXT();
  });

  // ----- 导出 TXT -----
  function exportTXT() {
    if (tasks.length === 0) {
      toast('暂无任务可导出');
      return;
    }
    const lines = [];
    const dt = new Date();
    const headerDate = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;

    lines.push('==============================================');
    lines.push('              三 件 事 · 每 日 记 录');
    lines.push('==============================================');
    lines.push(`导出时间：${headerDate}`);
    lines.push(`任务总数：${tasks.length}    已完成：${tasks.filter(t=>t.done).length}    待完成：${tasks.filter(t=>!t.done).length}`);
    lines.push('');

    const pending = tasks.filter(t => !t.done);
    const done = tasks.filter(t => t.done);

    if (pending.length) {
      lines.push('----------------------------------------------');
      lines.push(`【 待 完 成 · ${pending.length} 】`);
      lines.push('----------------------------------------------');
      pending.forEach((t, i) => {
        lines.push(`[${String(i+1).padStart(2,'0')}] ${t.text}`);
        lines.push(`     创建时间：${dateStr(t.createdAt)}`);
        if (t.note && t.note.trim()) {
          lines.push(`     心得感悟：${t.note.trim()}`);
        }
        lines.push('');
      });
    }

    if (done.length) {
      lines.push('----------------------------------------------');
      lines.push(`【 已 完 成 · ${done.length} 】`);
      lines.push('----------------------------------------------');
      done.forEach((t, i) => {
        lines.push(`[${String(i+1).padStart(2,'0')}] ${t.text}`);
        lines.push(`     创建时间：${dateStr(t.createdAt)}`);
        lines.push(`     完成时间：${dateStr(t.completedAt)}`);
        if (t.note && t.note.trim()) {
          lines.push(`     心得感悟：${t.note.trim()}`);
        }
        lines.push('');
      });
    }

    lines.push('==============================================');
    lines.push('           ·  END OF RECORD  ·');
    lines.push('==============================================');

    const content = lines.join('\n');
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fname = `三件事_${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}_${pad(dt.getHours())}${pad(dt.getMinutes())}.txt`;
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    toast('已导出 · ' + fname);
  }

  imageUpload.addEventListener('change', (e) => {
    handleImageUpload(e.target.files);
    e.target.value = '';
  });

  imgPreviewClose.addEventListener('click', closeImagePreview);
  imgPreviewModal.addEventListener('click', (e) => {
    if (e.target === imgPreviewModal) closeImagePreview();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !imgPreviewModal.classList.contains('hidden')) {
      closeImagePreview();
    }
  });

  renderImages();
  render();
})();
</script>
</body>
</html>
